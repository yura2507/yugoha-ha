name: "yuGoHA"
version: "0.4.4"
slug: "yugoha"
description: "yuGoHA: локальный сервер уведомлений, WebSocket/FCM и автоматическая установка интеграции Home Assistant. Важно: после первого запуска Home Assistant Core автоматически перезапустится один раз."
url: "https://github.com/yura2507/yugoha-ha"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false

ingress: true
ingress_port: 8099
panel_icon: "mdi:message-badge"
panel_title: "yuGoHA"
panel_admin: true

ports:
  8099/tcp: 8098
ports_description:
  8099/tcp: "yuGoHA API для Android и локальной синхронизации"

map:
  - type: homeassistant_config
    read_only: false

discovery:
  - yugoha

hassio_api: true
hassio_role: homeassistant
homeassistant_api: true

options:
  api_key: ""
schema:
  api_key: "password?"
